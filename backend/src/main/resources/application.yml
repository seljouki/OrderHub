spring:
  application:
    name: orderhub-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderhub}
    username: ${DB_USERNAME:orderhub}
    password: ${DB_PASSWORD:orderhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # schema is owned by Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    # Must be at least 32 characters. Always override in production via JWT_SECRET.
    secret: ${JWT_SECRET:change-me-local-dev-secret-at-least-32-chars}
    expiration: ${JWT_EXPIRATION:PT8H}
    issuer: orderhub
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    enabled: ${SEED_USERS:true}
    admin-email: ${ADMIN_EMAIL:admin@orderhub.dev}
    admin-password: ${ADMIN_PASSWORD:Admin123!}
    staff-email: ${STAFF_EMAIL:staff@orderhub.dev}
    staff-password: ${STAFF_PASSWORD:Staff123!}
