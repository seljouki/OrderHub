name: orderhub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderhub
      POSTGRES_USER: orderhub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orderhub}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderhub -d orderhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/orderhub
      DB_USERNAME: orderhub
      DB_PASSWORD: ${DB_PASSWORD:-orderhub}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-32-chars-min}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  db-data:
